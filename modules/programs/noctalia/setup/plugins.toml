[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[plugins]
enabled = ["noctalia/mpvpaper", "noctalia/wallpaper_depth"]
auto_update = "all"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Pictures/Wallpapers"
mute = true
run_as_systemd = true
extract_last_frame = false
mpv_options = "--hwdec=vaapi --loop=inf --override-display-fps=45"

[plugin_settings."noctalia/wallpaper_depth"]
